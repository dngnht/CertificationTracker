services:
  postgres:
    image: postgres:16-alpine
    container_name: certtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certtracker
      POSTGRES_PASSWORD: certtracker
      POSTGRES_DB: certtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local Azure Blob Storage emulator.
  # Start it and set FILE_STORAGE=azure with the connection string below.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: certtracker-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  azurite_data: