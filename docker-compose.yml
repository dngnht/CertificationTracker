# MVP: dùng SQLite (file:./dev.db) nên KHÔNG cần container PostgreSQL.
#
# Chỉ cần dịch vụ này nếu bạn bật FILE_STORAGE=azure và muốn chạy emulator
# Azure Blob Storage cục bộ (Azurite). Với FILE_STORAGE=local (mặc định MVP),
# bạn có thể bỏ qua toàn bộ file này.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: certtracker-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

volumes:
  azurite_data: